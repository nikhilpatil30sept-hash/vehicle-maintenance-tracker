name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new commit on the same branch/PR supersedes any run already in progress
# for it, so CI minutes aren't spent finishing a test of code nobody wants
# results for anymore.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      # tests/conftest.py points the app at a throwaway SQLite file and sets
      # its own SECRET_KEY/GEMINI_API_KEY before app.py is ever imported, so
      # this needs no real database, no secrets, and no network access.
      # See backend/README.md.
      - name: Run pytest
        working-directory: backend
        run: pytest

  backend-lint:
    name: Backend lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Rule selection lives in backend/pyproject.toml - a deliberately
      # curated set rather than Ruff's own (much broader) defaults, so a
      # future Ruff version can't silently make this stricter.
      - name: Run Ruff
        working-directory: backend
        run: ruff check .

  frontend-unit-tests:
    name: Frontend unit tests (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Jest
        working-directory: frontend
        run: npx react-scripts test --watchAll=false --coverage
        env:
          CI: true

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # CRA (react-scripts) treats ESLint warnings as build-breaking errors
      # whenever CI=true, which GitHub Actions sets on every runner by
      # default. This job exists specifically to catch that class of failure
      # here instead of on the next Vercel deploy - see commit 53da69a for
      # the incident this is guarding against.
      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          CI: true

  e2e-tests:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Every spec under e2e/ stubs its network calls with page.route (see
      # e2e/helpers.js), so this job never talks to a real backend or
      # database. playwright.config.js's webServer block boots the React dev
      # server itself and waits for it - no separate start/wait-on step
      # needed.
      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  load-test:
    name: Load test (k6)
    runs-on: ubuntu-latest
    # Informational only - deliberately NOT a required branch-protection
    # check. Performance thresholds are noisier than correctness tests and a
    # shared runner's performance varies run to run, so failing a merge over
    # it would cause false alarms. See backend/loadtest/README.md.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: carkeeper
          POSTGRES_PASSWORD: carkeeper
          POSTGRES_DB: carkeeper_loadtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U carkeeper"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Real Postgres, not the SQLite the pytest suite uses - write-path
      # concurrency behaves very differently under SQLite's file locking, and
      # Postgres is what the app actually runs on in production.
      - name: Start mock Gemini server
        working-directory: backend
        run: |
          python loadtest/mock_gemini_server.py &
          for i in $(seq 1 20); do
            curl -sf -X POST http://127.0.0.1:8090/ -o /dev/null && break
            sleep 0.5
          done

      - name: Prepare database schema
        # app.py runs db.create_all() at import time. gunicorn's workers all
        # import it at roughly the same moment, which races two workers into
        # creating the same table simultaneously and crashes one of them
        # ("table already exists") - caught locally before this ever reached
        # CI. Importing once, single-process, first means every table exists
        # before any worker boots, so each worker's own create_all() is a
        # no-op check instead of a race.
        working-directory: backend
        env:
          DATABASE_URL: postgresql://carkeeper:carkeeper@localhost:5432/carkeeper_loadtest
          SECRET_KEY: loadtest-secret-key
          GEMINI_API_KEY: loadtest-fake-key
          GEMINI_API_BASE: http://127.0.0.1:8090
          FLASK_ENV: production
        run: python -c "import app"

      - name: Start backend (gunicorn)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://carkeeper:carkeeper@localhost:5432/carkeeper_loadtest
          SECRET_KEY: loadtest-secret-key
          GEMINI_API_KEY: loadtest-fake-key
          GEMINI_API_BASE: http://127.0.0.1:8090
          FLASK_ENV: production
        run: |
          gunicorn -w 4 -b 0.0.0.0:5001 app:app &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5001/health -o /dev/null && break
            sleep 1
          done

      - name: Run k6 load test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: backend/loadtest/script.js
        env:
          BASE_URL: http://127.0.0.1:5001
