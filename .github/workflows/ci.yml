name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new commit on the same branch/PR supersedes any run already in progress
# for it, so CI minutes aren't spent finishing a test of code nobody wants
# results for anymore.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      # tests/conftest.py points the app at a throwaway SQLite file and sets
      # its own SECRET_KEY/GEMINI_API_KEY before app.py is ever imported, so
      # this needs no real database, no secrets, and no network access.
      # See backend/README.md.
      - name: Run pytest
        working-directory: backend
        run: pytest

  frontend-unit-tests:
    name: Frontend unit tests (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Jest
        working-directory: frontend
        run: npx react-scripts test --watchAll=false --coverage
        env:
          CI: true

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # CRA (react-scripts) treats ESLint warnings as build-breaking errors
      # whenever CI=true, which GitHub Actions sets on every runner by
      # default. This job exists specifically to catch that class of failure
      # here instead of on the next Vercel deploy - see commit 53da69a for
      # the incident this is guarding against.
      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          CI: true

  e2e-tests:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Every spec under e2e/ stubs its network calls with page.route (see
      # e2e/helpers.js), so this job never talks to a real backend or
      # database. playwright.config.js's webServer block boots the React dev
      # server itself and waits for it - no separate start/wait-on step
      # needed.
      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
