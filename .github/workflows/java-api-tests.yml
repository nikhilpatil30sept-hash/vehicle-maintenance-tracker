name: Java API tests

# JUnit 5 + REST Assured suite in api-tests-java/, run over real HTTP against
# the API and PostgreSQL containers from docker-compose.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: java-api-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api-tests:
    name: JUnit 5 + REST Assured against the API container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Fresh containers, so the API's per-address login limit starts at zero.
      - name: Start Postgres and the API
        run: docker compose up -d --wait db api

      - name: Run the Java API tests (Maven in a container)
        run: docker compose run --rm java-api-tests

      - name: API container logs
        if: failure()
        run: docker compose logs --no-color api

      - name: Upload Surefire reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: java-api-test-reports
          path: api-tests-java/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop and remove containers and volumes
        if: always()
        run: docker compose --profile test down -v
