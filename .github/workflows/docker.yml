name: Docker

# Builds every image, starts the app in Docker Compose (Postgres, API, web)
# and runs all four test suites as containers - the same commands that work on
# a laptop with Docker installed. See docs/DOCKER.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compose:
    name: App and tests in Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build all images
        run: docker compose --profile test --profile e2e build

      # --wait blocks until every service reports healthy (Postgres via
      # pg_isready, the API via /health, nginx via its index page).
      - name: Start Postgres, API and web
        run: docker compose up -d --wait

      - name: Smoke-test the running app
        run: |
          curl -fsS http://localhost:5001/health
          curl -fsS http://localhost:3000/ | grep -q '<div id="root"></div>'

      - name: Backend unit tests (pytest)
        run: docker compose run --rm backend-unit-tests

      # Real HTTP calls from a test container to the api container, which is
      # backed by the Postgres container - nothing mocked.
      - name: Integration tests (API + Postgres)
        run: docker compose run --rm integration-tests

      - name: Frontend unit tests (Jest)
        run: docker compose run --rm frontend-unit-tests

      - name: End-to-end tests (Playwright, 3 browsers)
        run: docker compose run --rm e2e-tests

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Upload e2e report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: docker-e2e-report
          path: frontend/playwright-report/html/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop and remove containers and volumes
        if: always()
        run: docker compose --profile test --profile e2e down -v
