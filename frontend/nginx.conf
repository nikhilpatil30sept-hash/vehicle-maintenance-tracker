# Serves the production React build inside the web container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: any path that isn't a real file gets index.html,
    # so refreshing the page on a client-side route still works.
    location / {
        try_files $uri /index.html;
    }

    # CRA puts a content hash in every file name under /static, so these
    # can be cached for a long time; index.html itself is never cached.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
